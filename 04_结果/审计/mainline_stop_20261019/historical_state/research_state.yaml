project:
  name: "跨风电场备用筛查的时空图迁移与局部条件基线决策增益评估"
  research_question: "在外部风场相同到达时刻SCADA信息约束与pitch完全扣留条件下，去除时空图交互的局部风速分箱基线是否足以完成备用筛查？跨场站迁移表示相较于该局部条件基准是否依然缺乏决策增益？"
  source_repository: "https://github.com/b1ue13e/windfarm-latent-boundary-risk.git (Local: E:\\论文3)"
  source_commit: "9e61215e76a6cfc4f2bb75ce492c6861da6d4ea9"
  imported_at: "2026-10-12T09:55:00+08:00"

research:
  baseline: "Site-Local Wspd-Bins (10-bin local conditional quantile), GBDT (B3 LightGBM), No-Graph MLP, Transferred STGQ"
  hypothesis: "H1: 外部风场稳态下局部风速分箱基线为最小充分模型且跨场时空图缺乏决策增益 (SUPPORTED); H2: 零特权协议下弱监督代理标签可恢复优于局部基准的决策函数 (FALSIFIED); H3: 潜伏状态后验为局部风险对冲机制而非全场成本最优 (SUPPORTED)"
  current_stage: "paper-writing"
  verified_contributions:
    - title: "最小充分模型分界原则 (Minimum Sufficient Model Hierarchy)"
      evidence: "paper_tste_ieee.md: Section IV, docs/STRONG_BASELINE_CLOSURE.md"
      finding: "证明物理规则在可观测带最强；稳态分布漂移优先采用非神经网络状态重校准；稳态及稀疏外部场站下本地风速分箱为最小充分决策函数 (+523k kWh 全场差异，p < 0.005)"
    - title: "潜伏控制状态表征恢复的单一主要中介机制 (Active Power Mediation)"
      evidence: "artifacts/channel_consequence_ablations.csv, docs/ACTIVE_POWER_IDENTIFIABILITY_AUDIT.md"
      finding: "主动功率遥测是潜伏状态恢复的核心中介 (Brier=0.0112, NMI=0.461, 切换召回率 62.9%)，尾流和热信道无增量收益，MoE动态路由无统计增益 (p=0.380)"
    - title: "切换期风险对冲与成本非等价性 (Risk Hedging vs Cost Non-equivalence)"
      evidence: "artifacts/matched_budget/exact_matched_budget_frontier.csv, docs/MATCHED_BUDGET_DECISIVE_REPORT.md"
      finding: "在切换窗口后验条件降低违约率 (8.36%->7.24%) 与短缺风险 (-296k kWh, p<0.005)，但以更高备用采购和全场 PSREI 成本为代价，属于风险对冲而非成本优势"
    - title: "跨场站与零特权监督边界检验 (Boundary Falsification Probes)"
      evidence: "artifacts/external_matched_control_benchmark.csv, artifacts/zero_privileged_supervision_benchmark.csv"
      finding: "外部场站 (Penmanshiel, Kelmarsh) 迁移无决策优势；零特权协议下后验模型未能战胜本地基线 (h=1 Delta=-365.9k, p=0.880; h=6 Delta=+3435.5k, p=0.484)"
  open_questions:
    - "EXP-03 异步网络到达包络在工业级 HPC / 集群环境的物理实测与延迟上限测量"
    - "从 Level-1 备用筛查风险指标向电网 Level-2 交流最优潮流 (AC-OPF) 调度经济收益的传导可行性验证"


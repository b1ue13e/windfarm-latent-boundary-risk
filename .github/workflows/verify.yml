name: Research Verification

on:
  pull_request:
  push:
    branches: [revision_topjournal_reconstruction]
  workflow_dispatch:
    inputs:
      full_gate:
        description: Run the artifact-backed decisive evidence gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  static-contract:
    name: Static contracts and evidence state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q windfarm_moe scripts .agents/scripts
      - name: Validate research state and required evidence
        run: python .agents/scripts/verify_gate.py --no-run-commands
      - name: Validate GitHub reproducibility contract
        run: python scripts/github_smoke_check.py

  full-evidence-gate:
    name: Full evidence gate (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_gate == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Check artifact availability
        run: python scripts/github_smoke_check.py --require-artifacts
      - name: Run the repository verification gate
        run: python .agents/scripts/verify_gate.py
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: .agent_state/GATE_REPORT.md
